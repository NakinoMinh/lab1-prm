<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>FAP Attendance Extension</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
    }
    .header {
      background: linear-gradient(135deg, #1B2A4A, #283D69);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #F36F21;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
    }
    .content {
      padding: 16px;
    }
    .card {
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #F36F21;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover {
      background: #D95C12;
    }
    .footer {
      font-size: 11px;
      color: #64748B;
      text-align: center;
      padding-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">FPT</div>
    <div>
      <div class="title">FAP Auto Attendance</div>
      <div style="font-size: 11px; opacity: 0.8;">Extension Hỗ trợ Giảng viên</div>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <strong>Hướng dẫn sử dụng:</strong>
      <ol style="padding-left: 18px; margin: 8px 0 0 0; line-height: 1.5;">
        <li>Mở trang điểm danh trên <strong>fap.fpt.edu.vn</strong></li>
        <li>Bấm <strong>"Đồng bộ từ Google Sheets"</strong> trên widget nổi</li>
        <li>Bấm <strong>"Tự động tích điểm danh"</strong> để hệ thống tự tick có mặt / vắng!</li>
      </ol>
    </div>
    <button id="open-fap-btn" class="btn">Mở Cổng FAP Ngay</button>
  </div>
  <div class="footer">
    Kết nối với Flutter Desktop App & Google Sheets
  </div>
  <script src="popup.js"></script>
</body>
</html>
